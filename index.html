<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>北苑生存资源地图 · 设备选择</title>
<link rel="stylesheet" href="css/app.css?v=202">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 20% -10%, #eef2ff 0%, #f7f8fa 45%, #f2f4f7 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: #1b1f26;
    -webkit-font-smoothing: antialiased;
  }
  .entry { width: min(920px, 92vw); text-align: center; padding: 24px 0 40px; }
  .entry .logo {
    width: 54px; height: 54px; border-radius: 15px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #1f6feb 0%, #9B45D0 55%, #E5342B 100%);
    box-shadow: 0 8px 22px rgba(31,111,235,.28);
  }
  .entry h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: .3px; }
  .entry .sub { margin: 0 0 4px; font-size: 13.5px; color: #5b6472; }
  .entry .meta { font-size: 12px; color: #8b93a1; margin-bottom: 28px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; gap: 14px; } }
  .card {
    background: #fff; border: 1px solid #e6e9ef; border-radius: 16px;
    padding: 26px 22px; cursor: pointer; text-align: left;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow: 0 2px 10px rgba(27,31,38,.05);
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(27,31,38,.12); border-color: #c9d6f5; }
  .card .ico {
    width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 14px;
  }
  .card.m .ico { background: linear-gradient(135deg,#e0f2fe,#bfdbfe); }
  .card.d .ico { background: linear-gradient(135deg,#ede9fe,#e0e7ff); }
  .card h2 { margin: 0 0 6px; font-size: 17px; font-weight: 680; }
  .card p  { margin: 0; font-size: 13px; color: #5b6472; line-height: 1.65; }
  .card .tag {
    display: inline-block; margin-top: 12px; font-size: 11.5px; color: #1f6feb;
    background: #eff4ff; border-radius: 5px; padding: 3px 8px;
  }
  .foot { margin-top: 26px; font-size: 12px; color: #8b93a1; }
  .foot a { color: #5b6472; }
  .remember { margin-top: 14px; font-size: 12.5px; color: #5b6472; }
  .remember input { vertical-align: -2px; margin-right: 6px; }
</style>
</head>
<body>
<div class="entry">
  <div class="logo"></div>
  <h1>北苑片区 · 生存资源地图</h1>
  <p class="sub">请先选择你的设备，我们会加载对应的界面</p>
  <p class="meta" id="meta-line">DEMO — 数据来自 OpenStreetMap ｜ 底图 © 高德地图</p>

  <div class="cards">
    <div class="card m" data-go="mobile.html">
      <div class="ico">📱</div>
      <h2>手机版</h2>
      <p>全屏二维地图（类似苹果地图），底部抽屉看详情。<br>图标更稀疏、不遮挡地图，单手可操作。</p>
      <span class="tag">推荐手机 / 平板竖屏</span>
    </div>
    <div class="card d" data-go="desktop.html">
      <div class="ico">🖥️</div>
      <h2>电脑版</h2>
      <p>左侧完整控制面板：图层筛选、断电可用性、候选地块、统计。<br>适合大屏仔细分析。</p>
      <span class="tag">推荐笔记本 / 台式机</span>
    </div>
  </div>

  <label class="remember"><input type="checkbox" id="remember" checked>记住我的选择，下次自动进入</label>
  <div class="foot">随时可在页面里点「切换版本」重新选择</div>
</div>

<script src="data/beiyuan.js?v=202"></script>
<script>
(function () {
  var SAVED = null;
  try { SAVED = localStorage.getItem("pm_device"); } catch (e) {}
  if (SAVED === "mobile" || SAVED === "desktop") {
    location.replace(SAVED === "mobile" ? "mobile.html" : "desktop.html");
    return;
  }
  var meta = document.getElementById("meta-line");
  if (meta && window.BEIYUAN && window.BEIYUAN.meta) {
    meta.textContent = window.BEIYUAN.meta.area + " ｜ 资源点 " +
      (window.BEIYUAN.pois ? window.BEIYUAN.pois.length : "—") + " 个";
  }
  document.querySelectorAll(".card").forEach(function (c) {
    c.addEventListener("click", function () {
      var dev = c.dataset.go === "mobile.html" ? "mobile" : "desktop";
      if (document.getElementById("remember").checked) {
        try { localStorage.setItem("pm_device", dev); } catch (e) {}
      }
      location.href = c.dataset.go;
    });
  });
})();
</script>
<script>
(function(){
  var B = '__STATS_BACKEND__';
  var S = 'prepper-map';
  var K = 'st_vid';
  var vid = '';
  try {
    vid = localStorage.getItem(K) || '';
    if (!vid) {
      vid = (crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(K, vid);
    }
  } catch (e) { vid = ''; }
  if (!vid) return;
  var t0 = Date.now(), done = false;
  function send(extra) {
    try {
      var u = B + '/hit?site=' + S + '&vid=' + encodeURIComponent(vid) + (extra || '');
      if (navigator.sendBeacon) navigator.sendBeacon(u);
      else fetch(u, { mode: 'no-cors', keepalive: true }).catch(function(){});
    } catch (e) {}
  }
  function leave() { if (done) return; done = true; send('&dwell=' + Math.round((Date.now() - t0) / 1000)); }
  send('');
  addEventListener('pagehide', leave);
  addEventListener('beforeunload', leave);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') leave(); });
})();
</script>
</body>
</html>
