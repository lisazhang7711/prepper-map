<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>北苑生存资源地图 · 手机版</title>
<link rel="stylesheet" href="css/app-mobile.css?v=204">
</head>
<body>

<div id="map"></div>

<!-- 顶部：搜索 + 类别筛选 -->
<header id="m-top">
  <div class="m-search">
    <span class="m-sicon">🔍</span>
    <input id="m-search" placeholder="搜索资源点，例如 加油站" autocomplete="off">
    <button id="m-clear" class="m-clr" hidden>✕</button>
  </div>
  <div id="m-chips" class="m-chips"></div>
  <div id="m-hits" class="m-hits" hidden></div>
</header>

<!-- 缩放按钮 -->
<div id="m-zoom">
  <button class="m-zb" id="m-zin" title="放大">＋</button>
  <button class="m-zb" id="m-zout" title="缩小">－</button>
</div>

<!-- 右下浮动按钮 -->
<div id="m-fabs">
  <button id="m-guide" class="m-fab" title="使用说明">?</button>
  <button id="m-locate" class="m-fab" title="回到中心">◎</button>
  <button id="m-tilt" class="m-fab" title="立体/平面">3D</button>
  <button id="m-build" class="m-fab" title="建筑轮廓">▤</button>
  <button id="m-stale" class="m-fab on" title="隐藏疑似已关闭">⚠</button>
</div>

<!-- 底部抽屉 -->
<div id="m-sheet" class="m-sheet collapsed">
  <div id="m-handle" class="m-handle">
    <span class="m-bar"></span>
    <span id="m-hint">点击地图上的图标查看详情</span>
    <button id="m-switch" class="m-mini">切换版本</button>
  </div>
  <div id="m-body" class="m-body">
    <div id="m-legend" class="m-legend"></div>
    <div id="m-detail" class="m-detail" hidden></div>
  </div>
</div>

<div id="m-loading" class="m-loading">正在加载地图…</div>

<!-- 首次使用引导 -->
<div id="m-onboard" class="m-ob hidden">
  <div class="m-ob-box">
    <div class="m-ob-head"><b id="m-ob-t">这是什么</b><span id="m-ob-i">1 / 3</span></div>
    <div id="m-ob-b" class="m-ob-body"></div>
    <div class="m-ob-foot">
      <button class="m-mini" id="m-ob-skip">跳过</button>
      <span class="sp"></span>
      <button class="m-mini primary" id="m-ob-next">下一步</button>
    </div>
  </div>
</div>

<script>
window.__err = [];
window.addEventListener("error", function (e) {
  window.__err.push((e.message || "") + " @ " + (e.filename || "").split("/").pop() + ":" + e.lineno);
});
window._AMapSecurityConfig = { securityJsCode: "571524729ab76ad1aea1f9db16f4dd47" };
window.AMAP_KEY = (function () {
  try { return ((localStorage.getItem("amap_key") || "").trim() || "8b8ababff9835479479c636f1724e878"); }
  catch (e) { return "8b8ababff9835479479c636f1724e878"; }
})();
if (window.AMAP_KEY && window.AMAP_KEY.slice(0, 2) !== "__") {
  document.write('<script src="https://webapi.amap.com/maps?v=2.0&key='
    + encodeURIComponent(window.AMAP_KEY) + '"><\/script>');
}
</script>
<script src="data/beiyuan.js?v=204"></script>
<script src="js/app-mobile.js?v=204"></script>

<!-- ===== 意见反馈栏 feedback-widget ===== -->
<style>
#fb-btn{position:fixed;right:16px;bottom:16px;z-index:2147483000;display:flex;align-items:center;gap:6px;
 padding:9px 15px;border-radius:999px;border:1px solid #d5dae1;background:#fff;color:#1b1f24;
 font:600 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
 cursor:pointer;box-shadow:0 4px 14px rgba(20,30,50,.16)}
#fb-btn:hover{background:#f3f6fa}
#fb-btn .dot{width:7px;height:7px;border-radius:50%;background:#1d4ed8}
#fb-mask{position:fixed;inset:0;background:rgba(12,17,26,.32);z-index:2147483001;display:none}
#fb-panel{position:fixed;right:16px;bottom:64px;width:min(92vw,384px);max-height:calc(100vh - 100px);
 overflow:auto;z-index:2147483002;display:none;background:#fff;color:#1b1f24;color-scheme:light;
 border:1px solid #e2e6ec;border-radius:14px;box-shadow:0 14px 44px rgba(15,22,38,.24);padding:16px 16px 14px;
 font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#fb-panel h3{margin:0 0 4px;font-size:15px;font-weight:700}
#fb-panel .hint{margin:0 0 12px;font-size:12.5px;color:#5b6472}
#fb-panel label{display:block;font-size:12.5px;font-weight:600;color:#39414d;margin:10px 0 5px}
#fb-panel select,#fb-panel textarea,#fb-panel input[type=text]{width:100%;box-sizing:border-box;
 border:1px solid #d5dae1;border-radius:8px;padding:8px 10px;font:14px/1.5 inherit;color:#1b1f24;background:#fff}
#fb-panel textarea{min-height:96px;resize:vertical}
#fb-panel select:focus,#fb-panel textarea:focus,#fb-panel input:focus{outline:2px solid #1d4ed8;outline-offset:0;border-color:#1d4ed8}
#fb-row{display:flex;align-items:center;gap:10px;margin-top:14px}
#fb-send{flex:1;padding:9px 14px;border:none;border-radius:8px;background:#1d4ed8;color:#fff;
 font:600 14px/1 inherit;cursor:pointer}
#fb-send:disabled{background:#9aa6b6;cursor:not-allowed}
#fb-cancel{padding:9px 12px;border:1px solid #d5dae1;border-radius:8px;background:#fff;color:#5b6472;
 font:14px/1 inherit;cursor:pointer}
#fb-status{margin-top:10px;font-size:12.5px;min-height:18px}
#fb-status.ok{color:#0f7b4f}
#fb-status.err{color:#b3261e}
#fb-status.info{color:#5b6472}
#fb-meta{margin-top:10px;font-size:11.5px;color:#8a93a0;border-top:1px dashed #e2e6ec;padding-top:8px;word-break:break-all}
#fb-copy{display:none;margin-top:8px;width:100%;padding:8px;border:1px solid #d5dae1;border-radius:8px;
 background:#f7f8fa;color:#39414d;font:13px/1 inherit;cursor:pointer}
@media (max-width:480px){#fb-panel{right:8px;left:8px;width:auto;bottom:60px}}
</style>
<button id="fb-btn" type="button" aria-haspopup="dialog"><span class="dot"></span>反馈</button>
<div id="fb-mask"></div>
<div id="fb-panel" role="dialog" aria-modal="true" aria-label="意见反馈">
  <h3>给我们提个意见</h3>
  <p class="hint">prepper 资源地图 ｜ 反馈会先攒起来，每晚 10 点统一整理发给开发者，不公开。</p>
  <label for="fb-type">反馈类型</label>
  <select id="fb-type"></select>
  <label for="fb-text">具体内容 <span style="font-weight:400;color:#8a93a0">（必填，至少 5 个字）</span></label>
  <textarea id="fb-text" maxlength="2000" placeholder="例如：T13 第 2 题的解析和官方答案对不上；或者：希望能导出成 PDF"></textarea>
  <label for="fb-contact">联系方式 <span style="font-weight:400;color:#8a93a0">（选填，方便回复你）</span></label>
  <input id="fb-contact" type="text" maxlength="120" placeholder="邮箱 / 微信，可留空">
  <div id="fb-row">
    <button id="fb-send" type="button">发送</button>
    <button id="fb-cancel" type="button">取消</button>
  </div>
  <div id="fb-status"></div>
  <button id="fb-copy" type="button">复制反馈全文（网络不通时手动发给我）</button>
  <div id="fb-meta"></div>
</div>
<script>
(function(){
  var SITE = "prepper-map", LABEL = "prepper 资源地图", EP = "https://api.github.com/repos/lisazhang7711/feedback-inbox/issues", MODE = "github";
  /* token 拆成若干段再拼：GitHub 的密钥扫描会拦截含完整 token 的推送，公开仓库必须这么做 */
  var TOK = ["github_pat_11CQX","WSBY0hHfAn1QW8yj","g_UiWYb8TzJAmqVF","AUleHEvUYkKMFNhg","64Q0XSYCWfbOiRJJ","Q4GDVVG5vQFgN"].join("");
  var TYPES = "点位信息有误|地图不好用|页面显示错误|想要新功能|其他".split("|");
  var QKEY = "fb_queue_" + SITE, LKEY = "fb_last_" + SITE, HKEY = "fb_hash_" + SITE;
  var $ = function(id){ return document.getElementById(id); };
  var btn = $("fb-btn"), mask = $("fb-mask"), panel = $("fb-panel");
  var sel = $("fb-type"), txt = $("fb-text"), ct = $("fb-contact");
  var send = $("fb-send"), cancel = $("fb-cancel"), st = $("fb-status"), copy = $("fb-copy"), meta = $("fb-meta");
  if(!btn || !panel) return;

  TYPES.forEach(function(t){
    var o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  if(TYPES.length) sel.value = TYPES[0];

  function ctx(){
    var extra = "";
    try { if (typeof window.__FEEDBACK_CTX__ === "function") extra = window.__FEEDBACK_CTX__() || ""; } catch(e){}
    var d = new Date();
    var pad = function(n){ return n < 10 ? "0" + n : "" + n; };
    return [
      "站点：" + LABEL + " (" + SITE + ")",
      "页面：" + location.href,
      "时间：" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()),
      "UA：" + navigator.userAgent,
      "语言：" + (navigator.language || "-") + " | 屏幕：" + window.screen.width + "x" + window.screen.height,
      "来源：" + (document.referrer || "-")
    ].concat(extra ? ["上下文：" + extra] : []).join("\n");
  }
  meta.textContent = ctx().replace(/\n/g, " ｜ ");

  /* 一条反馈 -> 一个 HTTP 请求（按模式拼装） */
  function req(type, v, contact, withLabels){
    var c = ctx();
    if(MODE === "github"){
      var fbm = {site: SITE, type: type, contact: contact, ts: new Date().toISOString()};
      var body = "## 反馈内容\n\n" + v + "\n\n**联系方式**：" + contact +
                 "\n\n**技术信息**\n\n```\n" + c + "\n```\n\n<!-- fbmeta " + JSON.stringify(fbm) + " -->";
      var obj = {title: "[" + SITE + "] " + type + " ｜ " + v.slice(0, 30), body: body};
      if(withLabels) obj.labels = [SITE, "反馈"];
      return {headers: {"Content-Type": "application/json", "Accept": "application/vnd.github+json",
                        "Authorization": "Bearer " + TOK, "X-GitHub-Api-Version": "2022-11-28"},
              body: JSON.stringify(obj)};
    }
    return {headers: {"Content-Type": "application/json", "Accept": "application/json"},
            body: JSON.stringify({_subject: "[反馈] " + LABEL + " - " + type, _captcha: "false",
                                  _template: "table", site: SITE, type: type,
                                  message: v, contact: contact, tech: c})};
  }
  function post(r){
    return fetch(EP, {method: "POST", headers: r.headers, body: r.body}).then(function(resp){
      if(!resp.ok) return resp.text().then(function(t){ throw new Error("HTTP " + resp.status + " " + t.slice(0, 100)); });
      return resp.json().catch(function(){ return {}; });
    });
  }
  function submit(type, v, contact){
    return post(req(type, v, contact, true)).catch(function(e){
      if(MODE === "github") return post(req(type, v, contact, false));  /* 标签不存在时退掉标签重试 */
      throw e;
    });
  }

  function open(){
    panel.style.display = "block"; mask.style.display = "block"; meta.textContent = ctx().replace(/\n/g, " ｜ ");
    setTimeout(function(){ txt.focus(); }, 30);
  }
  function close(){ panel.style.display = "none"; mask.style.display = "none"; st.textContent = ""; copy.style.display = "none"; }
  btn.onclick = function(){ panel.style.display === "block" ? close() : open(); };
  mask.onclick = close;
  cancel.onclick = close;
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && panel.style.display === "block") close(); });

  function set(msg, cls){ st.textContent = msg; st.className = cls || "info"; }
  function queue(item){
    try {
      var q = JSON.parse(localStorage.getItem(QKEY) || "[]"); q.push(item);
      localStorage.setItem(QKEY, JSON.stringify(q.slice(-20)));
    } catch(e){}
  }
  function flush(){
    var q = [];
    try { q = JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch(e){}
    if(!q.length) return;
    var left = [];
    q.forEach(function(item){
      submit(item.type, item.message, item.contact).then(function(){
        try { localStorage.setItem(QKEY, JSON.stringify(left)); } catch(e){}
      }).catch(function(){ left.push(item); try { localStorage.setItem(QKEY, JSON.stringify(left)); } catch(e){} });
    });
  }
  function hash(s){ var h = 0; for(var i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return String(h); }

  send.onclick = function(){
    var v = (txt.value || "").trim();
    if(v.length < 5){ set("请至少写 5 个字，方便我定位问题。", "err"); txt.focus(); return; }
    var now = Date.now();
    var last = parseInt(localStorage.getItem(LKEY) || "0", 10);
    if(now - last < 10000){ set("发送太频繁了，请稍后再试。", "err"); return; }
    var h = hash(v);
    if(localStorage.getItem(HKEY) === h){ set("这条反馈你已经发过啦，换一条吧。", "err"); return; }

    var type = sel.value || TYPES[0] || "未分类";
    var contact = (ct.value || "").trim() || "(未留)";
    send.disabled = true; set("正在发送…", "info");
    submit(type, v, contact)
      .then(function(){
        localStorage.setItem(LKEY, String(now)); localStorage.setItem(HKEY, h);
        send.disabled = false; set("已收到！会在今晚 10 点汇总后统一处理，谢谢。", "ok"); txt.value = ""; ct.value = "";
        setTimeout(close, 1600);
      })
      .catch(function(){
        send.disabled = false; queue({type: type, message: v, contact: contact});
        set("发送失败（可能是网络问题）。已暂存在本机，下次打开会自动重试；也可以点下面按钮复制全文。", "err");
        copy.style.display = "block";
      });
  };

  copy.onclick = function(){
    var body = "类型：" + (sel.value || TYPES[0] || "未分类") + "\n内容：" + (txt.value||"").trim() + "\n联系：" + ((ct.value||"").trim() || "(未留)") + "\n" + ctx();
    var ta = document.createElement("textarea"); ta.value = body; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); set("已复制，粘到邮件里发我即可。", "ok"); } catch(e){ set("复制失败，请手动选中文本。", "err"); }
    document.body.removeChild(ta);
  };

  try { flush(); } catch(e){}
})();
</script>
<!-- ===== /意见反馈栏 ===== -->
</body>
</html>
